services:
  api_keycloak_integration:
    build: .
    container_name: api_keycloak_integration
    restart: unless-stopped

    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/network-negrin
      DATASOURCE_USERNAME: desenv
      DATASOURCE_PASSWORD: 123ateo9
      QUARKUS_PROFILE: docker

    networks:
      - my-infra-docker

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.api-keycloak-integration.rule=Host(`api-keycloak-integration.supreme-network.site`)"
      - "traefik.http.routers.api-keycloak-integration.entrypoints=websecure"
      - "traefik.http.routers.api-keycloak-integration.tls=true"
      - "traefik.http.routers.api-keycloak-integration.tls.certresolver=letsencrypt"

      - "traefik.http.services.api-keycloak-integration.loadbalancer.server.port=8085"

networks:
  my-infra-docker:
    external: true